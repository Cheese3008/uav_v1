payload_gripper_controller:
  ros__parameters:
    topics:
      # Pose object đã transform + Kalman trong CubeDetector.
      # Topic này phải cùng hệ với PX4 local NED / map_ned.
      object_pose: /cube_detector/target_pose_world_filtered

      # Bool báo còn thấy target thật hay không.
      object_valid: /cube_detector/target_valid

      # Topic PX4 nhận VehicleCommand từ ROS2.
      vehicle_command: /fmu/in/vehicle_command

      # Chỉ dùng để debug trạng thái servo, không dùng làm command điều khiển.
      # true = đang gắp/giữ, false = đang nhả/mở.
      gripper_debug: /payload_gripper/gripper_grabbed_debug

    # Nếu quá thời gian này không có pose mới thì coi như mất object.
    object_timeout: 0.35

    # Điều khiển XY để bay vào tâm target.
    xy_kp: 0.8
    xy_deadband: 0.02
    xy_max_velocity: 0.8
    slew_acc: 0.9

    # Chỉ khi lateral error nhỏ hơn bán kính này mới coi là vào tâm thật.
    # 0.06 = 6 cm. Nếu pose nhiễu hoặc UAV khó giữ tâm, tăng lên 0.08.
    center_gate_radius: 0.06

    # Lệnh XY phải nhỏ hơn ngưỡng này mới tính là ổn định.
    # Tránh trường hợp vừa lướt qua tâm đã hạ luôn.
    center_stable_command_velocity: 0.06

    # Thời gian cần giữ ổn định trong vùng tâm trước khi lưu độ cao và bắt đầu hạ.
    approach_settle_time: 1.0

    # Độ cao UAV cần hạ xuống để gắp, tính theo abs(positionNed.z).
    # Nếu EKF local Z của bạn đang được range/distance hỗ trợ thì giá trị này sẽ bám theo local height đó.
    # 1.0 nghĩa là hạ xuống còn khoảng 1 m theo local Z.
    grab_target_altitude: 0.5
    grab_altitude_tolerance: 0.08

    # Vận tốc hạ, theo NED: vz > 0 là đi xuống.
    descend_velocity: 0.20

    # Quan trọng:
    # true = nếu đang hạ mà target lệch khỏi center_gate_radius hoặc mất object thì vz = 0.
    # UAV sẽ dừng hạ và chỉ chỉnh XY lại.
    descend_pause_when_unstable: true

    # Timeout cho pha hạ.
    # Bay từ 4.5 m xuống 1.0 m với 0.2 m/s cần khoảng 17.5 s.
    # Vì vậy không để 8 s nữa.
    descend_timeout: 25.0

    # Quan trọng:
    # false = timeout nhưng chưa tới độ cao gắp thì giữ vị trí, KHÔNG kích servo gắp.
    allow_grab_on_descend_timeout: false

    # Sau khi tới độ cao gắp, giữ lại một chút rồi ServoGripper sẽ kích gắp.
    grab_ready_settle_time: 0.50

    # Sau khi gắp xong, UAV bay lên lại độ cao đã lưu trước khi hạ.
    # Theo NED: vz < 0 là bay lên, code tự đổi dấu nên YAML để số dương.
    climb_velocity: 0.25
    climb_altitude_tolerance: 0.05

    # Nếu lưu độ cao lúc bắt đầu hạ là 4.5 m, đang ở 1.0 m, leo với 0.25 m/s cần khoảng 14 s.
    # Vì vậy tăng timeout leo lên để không complete sớm.
    climb_timeout: 20.0

    gripper:
      # QGC phải set:
      # PWM AUX1 = Peripheral via Actuator Set 1
      #
      # Actuator Set 1 tương ứng param1 trong VEHICLE_CMD_DO_SET_ACTUATOR.
      actuator_index: 1

      # Giống lệnh test thủ công:
      # gắp: param1 = 1.0
      # nhả: param1 = -1.0
      # Nếu cơ khí bị ngược thì đảo 2 giá trị này.
      grab_value: 1.0
      release_value: -1.0

      # Gửi lặp vài lần để giảm rủi ro miss command qua DDS.
      repeat_command_count: 3

      # Trạng thái phần mềm lúc node khởi động.
      # Không ảnh hưởng việc mở đầu mode, vì controller luôn gọi release(true) khi activate.
      initial_grabbed_state: false

      # false: khi mode completed/deactivate thì vẫn giữ vật, không tự nhả.
      release_on_deactivate: false

      # true: khi tới độ cao gắp thì vẫn gửi command gắp dù trạng thái nội bộ đang là grabbed.
      force_grab_command: true