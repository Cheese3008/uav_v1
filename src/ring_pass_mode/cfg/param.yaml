/**:
  ros__parameters:
    # =========================
    # Target validity
    # target_timeout phai lon hon thoi gian Detector giu predict bang Kalman
    # neu ban de body_kf_hold_timeout_s = 1.5 ben RingDetector thi de >= 1.6 o day.
    # =========================
    target_timeout: 1.70

    # Sau khi mode activate, controller se reset RingDetector.
    # Trong khoang nay bo qua pose cu de tranh vua kich mode da vao RING_PASS roi FINISHED gia.
    detector_reset_ignore_time: 0.60

    # Chi xem mat target la da bay qua vong khi UAV da that su bay toi truoc.
    # Neu target mat qua som hoac chua tung co lenh tien X thi quay lai WAIT_RING_TARGET.
    ringpass_min_time_before_finish: 1.00
    ringpass_min_forward_cmd_before_finish: 0.20

    # =========================
    # Dt limit cho external mode updateSetpoint
    # =========================
    ring_mode_dt_min_sec: 0.005
    ring_mode_dt_max_sec: 0.10

    # =========================
    # Dieu khien truc Y body
    # y > 0: tam vong nam ben phai drone.
    # =========================
    ringpass_kp_y: 0.80
    ringpass_kd_y: 0.00
    ringpass_y_deadband: 0.03
    ringpass_vy_max: 1.20

    # =========================
    # Dieu khien truc Z body / NED-Z
    # z body/NED duong la huong xuong.
    # target_z_offset = 0.40 nghia la drone bay cao hon tam vong 0.40 m.
    # =========================
    ringpass_kp_z: 0.80
    ringpass_kd_z: 0.00
    ringpass_z_deadband: 0.04
    ringpass_vz_max: 0.70
    ringpass_target_z_offset: 0.40

    # =========================
    # Forward speed body-X
    # Neu sai so YZ lon hon approach_radius thi vx = 0, chi can tam vong truoc.
    # Khi sai so YZ nho hon approach_radius thi bat dau bay xuyen vong.
    # =========================
    ringpass_vx_min: 1.50
    ringpass_vx_max: 2.00
    ringpass_yz_approach_radius: 0.35
    ringpass_yz_full_speed_radius: 0.10
    ringpass_x_speed_curve_gain: 8.00

    # =========================
    # Slew rate limit
    # =========================
    ringpass_slew_xy: 0.9
    ringpass_slew_z: 0.9